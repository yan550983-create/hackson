name: PR offline static checks

on:
  pull_request:
    paths:
      - ".github/workflows/pr-offline-checks.yml"
      - "tests/**"
      - "web/**"
      - "index.html"

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out PR code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check static entrypoints and local assets
        run: python3 -m unittest discover -s tests -v
